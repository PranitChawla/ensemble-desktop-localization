[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ensemble-desktop-localization"
version = "0.1.0"
description = "Open-ended Python-tool-assisted GUI grounding with a frozen, diverse VLM pool"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<0.29", "Pillow>=11,<13", "numpy>=2,<3"]

[project.optional-dependencies]
cloud = ["modal==1.6.3"]
dev = ["pytest>=8,<10", "ruff>=0.12"]

[project.scripts]
gui-grounding = "grounding.cli:main"

[tool.setuptools]
py-modules = ["submission"]

[tool.setuptools.packages.find]
include = ["grounding*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]


[tool.setuptools.package-data]
grounding = ["templates/*.json", "templates/*.txt"]
